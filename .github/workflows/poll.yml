name: Poll TfL Arrivals

# Triggered externally (cron-job.org -> workflow_dispatch REST API) every ~5 minutes, not by
# GitHub's own `schedule:` trigger — GitHub silently deprioritizes schedule-triggered runs on
# repos with no recent pushes, which was observed degrading this pipeline's real cadence to
# hours instead of minutes. workflow_dispatch isn't subject to that throttling.
on:
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    concurrency:
      group: poll-tfl-arrivals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run poll
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
